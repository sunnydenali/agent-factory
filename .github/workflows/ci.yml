name: Factory CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  factory-ci:
    name: factory-ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned development tools
        run: python -m pip install -r requirements-dev.txt
      - name: Compile Python
        run: python -m compileall -q scripts tests examples
      - name: Lint
        run: ruff check .
      - name: Check formatting
        run: ruff format --check .
      - name: Test and report coverage
        run: |
          coverage run -m unittest discover -s tests -v
          coverage run -a -m unittest discover -s examples/sample-app -v
          coverage report -m
